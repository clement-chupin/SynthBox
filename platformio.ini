; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = GrvEP_16MB.csv
monitor_speed = 115200
extra_scripts = pre:extra_scripts/patch_fastled_dma.py

build_flags =
    -DBOARD_HAS_PSRAM=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DFASTLED_RMT_MAX_CHANNELS=1
    ; FASTLED_ESP32_FLASH_LOCK removed: DMA_ENABLED doesn't need it
    ; USB MIDI: use TinyUSB OTG mode (not the built-in JTAG/serial debug unit).
    ; Without ARDUINO_USB_MODE=0, the ESP32-S3 enumerates as 303a:1001 (JTAG debug)
    ; instead of a MIDI device — TinyUSB never gets to run.
    -DARDUINO_USB_MODE=0
    -DCONFIG_TINYUSB_MIDI_ENABLED=1
    -DARDUINO_USB_MIDI_ON_BOOT=1
    ; AMY_WAVETABLE: enables render_wavetable() and the 5 built-in wavetables baked into
    ; pcm_samples_tiny.h (111/BRAIDS01/PPG_WA00/SINE2SAW/VIRAL) — used by the modular synth.
    -DAMY_WAVETABLE=1

build_src_filter = +<*> -<wifi_audio.cpp>

lib_deps =
    fastled/FastLED@^3.10.3
    adafruit/Adafruit TCA8418@^1.0.2
    olikraus/U8g2@^2.36.18
    ${PROJECT_DIR}/../other_projects/amy