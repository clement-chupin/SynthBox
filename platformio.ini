; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; src_dir is the repo root (not the default "src") so build_src_filter below can pull in
; both src/ (GrvEP's own app code, unchanged) and engine/ (SevenistSynth_RitualMachine's
; vendored DSP engine, sitting at the repo root as a sibling of src/ — see
; ~/.claude/plans/mutable-nibbling-melody.md) as one firmware image. Mirrors exactly how
; the engine's own upstream project builds this same split (apps/ritual_machine/
; platformio.ini's src_dir = ../..) — "include/" stays auto-added regardless of src_dir.
[platformio]
src_dir = .

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = GrvEP_16MB.csv
monitor_speed = 115200
extra_scripts = pre:extra_scripts/patch_fastled_dma.py

build_flags =
    -DBOARD_HAS_PSRAM=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DFASTLED_RMT_MAX_CHANNELS=1
    ; FASTLED_ESP32_FLASH_LOCK removed: DMA_ENABLED doesn't need it
    ; USB MIDI: use TinyUSB OTG mode (not the built-in JTAG/serial debug unit).
    ; Without ARDUINO_USB_MODE=0, the ESP32-S3 enumerates as 303a:1001 (JTAG debug)
    ; instead of a MIDI device — TinyUSB never gets to run.
    -DARDUINO_USB_MODE=0
    -DCONFIG_TINYUSB_MIDI_ENABLED=1
    -DARDUINO_USB_MIDI_ON_BOOT=1
    ; USB Mass Storage (MODE_USB): exposes the SD card as a normal drive over the same USB
    ; cable, composited alongside the MIDI interface above — see USBMSC.h's own guard macro.
    -DCONFIG_TINYUSB_MSC_ENABLED=1
    ; Real USB Audio Class device (replaces the earlier piggybacked-CDC bridge — that
    ; approach's bulk-transfer bandwidth was found to hard-cap around ~7-10KB/s on this
    ; chip regardless of tuning, forcing lossy 7350Hz/8-bit mono; UAC uses a dedicated
    ; isochronous endpoint with guaranteed bandwidth, so this carries full 44.1kHz/16-bit
    ; stereo with no python bridge script needed — the host OS sees a real sound card).
    ; The precompiled TinyUSB .a for this framework version already has audio class
    ; support linked in (confirmed via its sdkconfig snapshot) — this flag only turns on
    ; the Arduino-side USBAudioCard wrapper, no TinyUSB rebuild needed. Endpoint budget:
    ; mic-only (UAC_SPK_NONE) needs 1 free IN endpoint, which this composite device has
    ; alongside the existing MIDI+MSC+CDC (confirmed free: IN3/OUT4/OUT5 unused).
    -DCONFIG_TINYUSB_AUDIO_ENABLED=1
    ; AMY_WAVETABLE: enables render_wavetable() and the 5 built-in wavetables baked into
    ; pcm_samples_tiny.h (111/BRAIDS01/PPG_WA00/SINE2SAW/VIRAL) — used by the modular synth.
    -DAMY_WAVETABLE=1
    ; So audio_engine.cpp's quoted #include "engine/core/engine.h" (and the engine's own
    ; internal cross-includes, same style) resolve against the repo root.
    -I.
    ; Vendored engine (framework/engine/dsp/config.h defaults): match AMY's 44.1kHz.
    ; ENGINE_CMD_RING=512 (the library default) costs ~137KB of internal RAM; even the
    ; friend's own firmware's 128 (~34KB) left only ~9KB of free heap on this board once
    ; combined with GrvEP's own UI + AMY's own state, and starved a later
    ; xTaskCreatePinnedToCore call (confirmed via ESP.getFreeHeap() on real hardware).
    ; 32 is plenty for Phase 1 — nothing posts commands at any real rate yet.
    -DENGINE_SR=44100
    -DENGINE_CMD_RING=32
    -DENGINE_FX_MONO=1
    -DENGINE_REVERB_HALF=1
    -std=gnu++17
    -fno-exceptions
    -fno-rtti

build_unflags =
    -std=gnu++11
    -std=gnu++2a

; The Arduino framework appends -Os (size) AFTER build_flags' own flags, so without this
; the vendored engine would compile for size instead of speed — see the engine's own
; upstream platformio.ini for the identical fix/reasoning. Project sources only (src/ +
; engine/), not the framework/libraries.
build_src_flags =
    -O2
    -fno-stack-protector

; +<dir/> (trailing slash, no wildcard) recurses the whole tree — same syntax the engine's
; own upstream project uses for the identical src/+framework/ split.
build_src_filter =
    +<src/>
    -<src/wifi_audio.cpp>
    +<engine/>

lib_deps =
    ; Exact pin, not ^3.10.3: 3.10.7 added a ClearFlags::BRIGHTNESS enum value that
    ; collides with include/HWConfig.h's own #define BRIGHTNESS 50 and fails to
    ; compile. The original GrvEP repo never hit this because its .pio/libdeps/ cache
    ; still holds the 3.10.3 it first resolved; this fork's fresh .pio/ re-resolved the
    ; ^-range against the registry and got the newer, broken-for-us version.
    fastled/FastLED@3.10.3
    adafruit/Adafruit TCA8418@^1.0.2
    olikraus/U8g2@^2.36.18
    ; AMY is the copy vendored in lib/AMY Synthesizer (same source the simulator/Android/Web
    ; builds compile) — PlatformIO picks it up from lib/ automatically, no lib_deps entry.
